name: Download and Commit File

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      url:
        description: 'URL of the file to download (optional)'
        required: false
        default: ''
        type: string
      move_existing_files:
        description: 'Move files, update commit messages, and generate release redirects'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: download-and-commit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download-and-commit:
    if: ${{ github.event_name != 'push' || !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        
      - name: Download, reorganize, update logs and list, and commit
        shell: bash
        env:
          DOWNLOAD_URL: ${{ inputs.url }}
          MOVE_EXISTING_FILES: ${{ inputs.move_existing_files }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          DOWNLOAD_URL="${DOWNLOAD_URL:-}"
          MOVE_EXISTING_FILES="${MOVE_EXISTING_FILES:-false}"
          EVENT_NAME="${EVENT_NAME:-workflow_dispatch}"
          if [[ -z "$DOWNLOAD_URL" && "$MOVE_EXISTING_FILES" != true && "$EVENT_NAME" != push ]]; then
            echo "No URL provided and moving existing files is disabled. Nothing to do."
            exit 0
          fi

          TIMESTAMP=$(TZ=UTC date +"%Y-%m-%d_%H-%M-%S")
          TEMP_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/repo-download.XXXXXX")
          trap 'rm -rf -- "$TEMP_DIR"' EXIT
          DOWNLOADED_PATH=""
          DOWNLOAD_ADDED=false
          FILE=""
          CURRENT_URL="N/A (no download requested)"

          mkdir -p "$TEMP_DIR/download"

          # Shared metadata and listing helpers stay outside the repository.
          cat > "$TEMP_DIR/metadata.py" <<'PY'
          import hashlib
          import html
          import json
          import os
          import re
          import subprocess
          import sys
          from decimal import Decimal, localcontext
          from pathlib import Path
          from urllib.parse import quote, quote_from_bytes
          from urllib.request import Request, urlopen

          BASE_URL = "https://andres9890.github.io/files/"
          UNITS = ("B", "KB", "MB", "GB", "TB", "PB", "EB")
          NO_DOWNLOAD = "N/A (no download requested)"


          def format_size(byte_count):
              byte_count = int(byte_count)
              if byte_count < 1024:
                  return f"{byte_count} bytes"
              with localcontext() as context:
                  context.prec = 100
                  value = Decimal(byte_count)
                  unit = 0
                  while value >= 1024 and unit < len(UNITS) - 1:
                      value /= 1024
                      unit += 1
                  number = format(value, ".2f")
                  if "." in number:
                      number = number.rstrip("0").rstrip(".")
              return f"{number} {UNITS[unit]} ({byte_count} bytes)"


          def current_url(filename):
              return BASE_URL + quote(filename, safe="")


          def github_items(endpoint):
              api_url = os.environ.get(
                  "GITHUB_API_URL", "https://api.github.com"
              ).rstrip("/")
              headers = {
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "release-redirect-generator",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              token = os.environ.get("GITHUB_TOKEN", "")
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              page = 1
              while True:
                  request = Request(
                      f"{api_url}{endpoint}?per_page=100&page={page}",
                      headers=headers,
                  )
                  with urlopen(request, timeout=30) as response:
                      items = json.load(response)
                  if not isinstance(items, list):
                      raise RuntimeError(
                          f"GitHub returned an unexpected response for {endpoint}"
                      )
                  yield from items
                  if len(items) < 100:
                      break
                  page += 1


          def release_redirect_html(url):
              attribute_url = html.escape(url, quote=True)
              script_url = json.dumps(url, ensure_ascii=True).replace(
                  "<", "\\u003c"
              ).replace(">", "\\u003e").replace("&", "\\u0026")
              return (
                  '<!DOCTYPE html>\n<html>\n<head>\n'
                  f'<meta http-equiv="refresh" content="0;url={attribute_url}">\n'
                  f'<script>window.location.replace({script_url});</script>\n'
                  '</head>\n<body></body>\n</html>\n'
              )


          def generate_release_redirects():
              repository = os.environ.get("GITHUB_REPOSITORY", "")
              if not re.fullmatch(r"[^/]+/[^/]+", repository):
                  raise RuntimeError("GITHUB_REPOSITORY must contain owner/repo")
              releases = sorted(
                  (
                      release for release in github_items(
                          f"/repos/{repository}/releases"
                      ) if not release.get("draft", False)
                  ),
                  key=lambda release: (
                      release.get("published_at")
                      or release.get("created_at", ""),
                      release["id"],
                  ),
                  reverse=True,
              )
              selected = {}
              for release in releases:
                  # This endpoint lists uploaded assets, excluding GitHub's
                  # generated zipball/tarball source archives. Uploaded ZIP
                  # and tar.gz assets are included like every other file.
                  for asset in github_items(
                      f"/repos/{repository}/releases/{release['id']}/assets"
                  ):
                      if asset.get("state") != "uploaded":
                          continue
                      name = asset.get("name", "")
                      url = asset.get("browser_download_url", "")
                      if (
                          not name or name in (".", "..")
                          or "/" in name or "\\" in name or "\0" in name
                      ):
                          raise RuntimeError(f"Invalid release filename: {name!r}")
                      if not url.startswith("https://"):
                          raise RuntimeError(f"Invalid download URL for {name!r}")
                      # A shared filename points to its newest published release.
                      selected.setdefault(name, url)

              changes = []
              for name, url in sorted(
                  selected.items(), key=lambda item: (item[0].casefold(), item[0])
              ):
                  target = Path(name + ".html")
                  content = release_redirect_html(url)
                  if target.is_symlink() or (
                      target.exists() and not target.is_file()
                  ):
                      raise RuntimeError(f"Cannot replace non-file: {target}")
                  if target.exists():
                      existing = target.read_text(encoding="utf-8")
                      if existing == content:
                          continue
                      # Existing minimal redirect pages can be refreshed;
                      # unrelated HTML documents are preserved.
                      if not re.fullmatch(
                          r'\s*<!DOCTYPE html>\s*<html>\s*<head>\s*'
                          r'<meta\b[^>]*http-equiv=["\x27]refresh["\x27][^>]*>\s*'
                          r'<script>\s*window\.location\.replace\(.*?\);\s*</script>\s*'
                          r'</head>\s*<body>\s*</body>\s*</html>\s*',
                          existing, flags=re.IGNORECASE | re.DOTALL,
                      ):
                          raise RuntimeError(
                              f"Refusing to overwrite unrelated HTML: {target}"
                          )
                  changes.append((target, content))

              for target, content in changes:
                  target.write_text(content, encoding="utf-8")
                  subprocess.run(["git", "add", "-f", "--", str(target)], check=True)
              print(
                  f"Checked {len(selected)} release files; "
                  f"created or updated {len(changes)} HTML redirects."
              )


          def field(text, name):
              match = re.search(
                  rf"(?m)^-[ \t]*{re.escape(name)}:[ \t]*(.*)$", text
              )
              return match.group(1).strip() if match else ""


          def update_old_logs():
              root_files = sorted(
                  (
                      path for path in Path(".").iterdir()
                      if path.is_file() and not path.is_symlink()
                  ),
                  key=lambda path: path.name,
              )
              by_name = {path.name: path for path in root_files}
              hash_cache = {}
              updated_count = 0

              def digest(path, algorithm):
                  key = (path, algorithm)
                  if key not in hash_cache:
                      hasher = hashlib.new(algorithm)
                      with path.open("rb") as handle:
                          for chunk in iter(
                              lambda: handle.read(1024 * 1024), b""
                          ):
                              hasher.update(chunk)
                      hash_cache[key] = hasher.hexdigest()
                  return hash_cache[key]

              def find_current_file(filename, text):
                  expected = field(text, "SHA256").lower()
                  algorithm = "sha256"
                  if not expected:
                      expected = field(text, "MD5").lower()
                      algorithm = "md5"
                  named_file = by_name.get(filename)
                  if not expected:
                      return named_file
                  candidates = []
                  if named_file is not None:
                      candidates.append(named_file)
                  candidates.extend(
                      path for path in root_files if path != named_file
                  )
                  for candidate in candidates:
                      if digest(candidate, algorithm) == expected:
                          return candidate
                  return None

              for log in sorted(Path("workflow").rglob("commit_msg_*.txt")):
                  if not log.is_file() or log.is_symlink():
                      continue
                  try:
                      original = log.read_text(encoding="utf-8")
                  except UnicodeError:
                      print(f"Skipping non-UTF-8 log: {log}")
                      continue
                  text = original
                  filename = field(text, "File")
                  if not filename:
                      first_line = text.splitlines()[0] if text else ""
                      match = re.fullmatch(
                          r'Add downloaded file "(.*)"'
                          r'(?: and flatten existing folders)?', first_line
                      )
                      if match:
                          filename = match.group(1)

                  url = NO_DOWNLOAD
                  if filename:
                      actual = find_current_file(filename, text)
                      byte_count = None
                      if actual is not None:
                          filename = actual.name
                          byte_count = actual.stat().st_size
                          text = re.sub(
                              r"(?m)^- File:.*$",
                              lambda _: f"- File: {filename}", text, count=1
                          )
                      else:
                          match = re.search(
                              r"\(([\d,]+) bytes\)", field(text, "Size")
                          )
                          if not match:
                              match = re.fullmatch(
                                  r"([\d,]+)[ \t]*(?:bytes|B)",
                                  field(text, "Size"),
                              )
                          if match:
                              byte_count = int(match.group(1).replace(",", ""))
                      if byte_count is not None:
                          size_line = f"- Size: {format_size(byte_count)}"
                          if re.search(r"(?m)^- Size:", text):
                              text = re.sub(
                                  r"(?m)^- Size:.*$", lambda _: size_line,
                                  text, count=1
                              )
                          else:
                              text = text.rstrip("\n") + "\n" + size_line + "\n"
                      else:
                          print(
                              f"Could not recover exact size for {log}; "
                              "keeping its existing size."
                          )
                      url = current_url(filename)

                  lines = [
                      line for line in text.splitlines()
                      if not re.match(
                          r"(?i)^(?:-[ \t]*)?Current URL:", line
                      )
                  ]
                  while lines and not lines[-1].strip():
                      lines.pop()
                  lines.append(f"- Current URL: {url}")
                  updated = "\n".join(lines) + "\n"
                  if updated != original:
                      log.write_text(updated, encoding="utf-8")
                      updated_count += 1
              print(f"Updated {updated_count} previous commit-message files.")


          def migrate_list_name():
              legacy = Path("list.txt")
              if not legacy.is_file() or legacy.is_symlink():
                  return
              try:
                  lines = legacy.read_text(encoding="utf-8").splitlines()
              except UnicodeError:
                  return
              # Only migrate the old generated index, preserving other files
              # that happen to be named list.txt.
              if BASE_URL + "list.txt" not in lines:
                  return
              if not all(line.startswith(BASE_URL) for line in lines):
                  return
              target = Path("liste.txt")
              if target.exists() or target.is_symlink():
                  legacy.unlink()
              else:
                  legacy.rename(target)
              print("Migrated the generated list.txt index to liste.txt.")


          def build_file_list():
              # The staged Git index contains all files that will be committed,
              # including nested files, and excludes internal .git metadata.
              paths = set(subprocess.check_output(
                  ["git", "ls-files", "--cached", "-z"]
              ).split(b"\0"))
              paths.discard(b"")
              paths.add(b"liste.txt")
              links = [
                  BASE_URL + quote_from_bytes(path, safe="/")
                  for path in sorted(
                      paths,
                      key=lambda path: (
                          path.decode("utf-8", "surrogateescape").casefold(),
                          path,
                      ),
                  )
              ]
              Path("liste.txt").write_text(
                  "\n".join(links) + "\n", encoding="utf-8"
              )
              print(f"Updated liste.txt with {len(links)} site links.")


          if sys.argv[1] == "size":
              print(format_size(sys.argv[2]))
          elif sys.argv[1] == "url":
              print(current_url(sys.argv[2]))
          elif sys.argv[1] == "update":
              update_old_logs()
          elif sys.argv[1] == "index":
              build_file_list()
          elif sys.argv[1] == "migrate-index":
              migrate_list_name()
          elif sys.argv[1] == "release-redirects":
              generate_release_redirects()
          else:
              raise SystemExit("Unknown metadata command")
          PY

          python3 "$TEMP_DIR/metadata.py" migrate-index

          if [[ -n "$DOWNLOAD_URL" ]]; then
            # Download outside the repository so temporary files are never committed.
            (
              cd "$TEMP_DIR/download"
              curl --fail --silent --show-error --location --globoff \
                --remote-name --remote-header-name -- "$DOWNLOAD_URL"
            )

            mapfile -d '' -t DOWNLOADS < <(find "$TEMP_DIR/download" -maxdepth 1 -type f -print0)
            if [ "${#DOWNLOADS[@]}" -ne 1 ]; then
              echo "Error: Download failed or did not save exactly one file."
              exit 1
            fi
            DOWNLOADED_PATH="${DOWNLOADS[0]}"
            echo "Downloaded file: ${DOWNLOADED_PATH##*/}"

            FILE_SIZE=$(wc -c < "$DOWNLOADED_PATH")
            MAX_SIZE=$((100 * 1024 * 1024))
            if [ "$FILE_SIZE" -gt "$MAX_SIZE" ]; then
              echo "Error: File size ($((FILE_SIZE / 1024 / 1024)) MB) exceeds the 100MB limit."
              exit 1
            fi

            FILE_TYPE=$(file -b -- "$DOWNLOADED_PATH")
            FILE_SIZE_HR=$(python3 "$TEMP_DIR/metadata.py" size "$FILE_SIZE")
            FILE_MD5=$(md5sum -- "$DOWNLOADED_PATH" | awk '{print $1}')
            FILE_SHA1=$(sha1sum -- "$DOWNLOADED_PATH" | awk '{print $1}')
            FILE_SHA256=$(sha256sum -- "$DOWNLOADED_PATH" | awk '{print $1}')
            FILE_CRC32=$(python3 -c "import sys, binascii; print(format(binascii.crc32(open(sys.argv[1], 'rb').read()) & 0xFFFFFFFF, '08x'))" "$DOWNLOADED_PATH")
            FILE_MOD_TIME=$(stat -c "%y" -- "$DOWNLOADED_PATH")
          else
            echo "No URL provided; skipping download."
          fi

          # Move without overwriting existing files. Identical files are reused;
          # different files with the same name become name(1).ext, name(2).ext, etc.
          # PLACED_PATH and PLACED_NEW describe the result for the caller.
          place_file() {
            local source="$1" destination_dir="$2"
            local filename="${source##*/}" stem suffix="" candidate number=0
            stem="$filename"
            if [[ "$filename" == ?*.* ]]; then
              stem="${filename%.*}"
              suffix=".${filename##*.}"
            fi
            candidate="$destination_dir/$filename"

            # Reserve liste.txt for the automatically refreshed index.
            if [[ "$candidate" == ./liste.txt ]]; then
              number=1
              candidate="$destination_dir/${stem}(${number})${suffix}"
            fi

            while [[ -e "$candidate" || -L "$candidate" ]]; do
              if [[ -f "$candidate" && ! -L "$candidate" && ! -L "$source" ]] \
                && cmp -s -- "$source" "$candidate"; then
                echo "Reusing identical file: $candidate"
                rm -- "$source"
                PLACED_PATH="$candidate"
                PLACED_NEW=false
                git add -f -- "$candidate"
                return
              fi
              number=$((number + 1))
              candidate="$destination_dir/${stem}(${number})${suffix}"
            done

            echo "Moving '$source' to '$candidate'"
            mv -- "$source" "$candidate"
            PLACED_PATH="$candidate"
            PLACED_NEW=true
            git add -f -- "$candidate"
          }

          # This folder stores commit-message text files, not GitHub Actions YAML.
          mkdir -p workflow

          if [[ "$MOVE_EXISTING_FILES" == true ]]; then
            # Migrate commit messages from the old location first.
            if [ -d texts/workflow ]; then
              while IFS= read -r -d '' OLD_FILE; do
                place_file "$OLD_FILE" workflow
              done < <(find texts/workflow \( -type f -o -type l \) -print0)
            fi

            # Flatten existing subfolders. Keep Git internals, GitHub configuration,
            # and the commit-message folder in their proper locations.
            while IFS= read -r -d '' OLD_FILE; do
              place_file "$OLD_FILE" .
            done < <(
              find . \( -path './.git' -o -path './.github' -o -path './workflow' \) -prune \
                -o \( -type f -o -type l \) -path './*/*' -print0
            )

            # Remove the emptied folders, working from children to parents.
            while IFS= read -r -d '' OLD_DIR; do
              rmdir -- "$OLD_DIR" 2>/dev/null || true
            done < <(
              find . \( -path './.git' -o -path './.github' -o -path './workflow' \) -prune \
                -o -type d ! -path . -print0 | sort -zr
            )
          else
            echo "Moving existing files is disabled; keeping existing folders."
          fi

          # Every download goes directly into the repository root.
          if [[ -n "$DOWNLOADED_PATH" ]]; then
            place_file "$DOWNLOADED_PATH" .
            FILE="${PLACED_PATH##*/}"
            DOWNLOAD_ADDED="$PLACED_NEW"
            CURRENT_URL=$(python3 "$TEMP_DIR/metadata.py" url "$FILE")
          fi

          if [[ "$MOVE_EXISTING_FILES" == true ]]; then
            python3 "$TEMP_DIR/metadata.py" release-redirects
            python3 "$TEMP_DIR/metadata.py" update
          fi

          # Include file moves and deletions, even if the download was a duplicate.
          git add -A
          # Refresh the list for downloads, migrations, and direct repository pushes.
          python3 "$TEMP_DIR/metadata.py" index
          git add -f -- liste.txt
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Use timestamp-only log names, adding a number only if the name is taken.
          MSG_FILE="workflow/commit_msg_${TIMESTAMP}.txt"
          MSG_NUMBER=1
          while [[ -e "$MSG_FILE" || -L "$MSG_FILE" ]]; do
            MSG_FILE="workflow/commit_msg_${TIMESTAMP}(${MSG_NUMBER}).txt"
            MSG_NUMBER=$((MSG_NUMBER + 1))
          done
          {
            if [ "$DOWNLOAD_ADDED" = true ]; then
              printf 'Add downloaded file "%s"\n' "$FILE"
            else
              printf 'Update repository file list and metadata\n'
            fi
            printf '\nMove existing files to root: %s\n' "$MOVE_EXISTING_FILES"
            if [[ -n "$DOWNLOAD_URL" ]]; then
              printf '\nMetadata:\n'
              printf -- '- File: %s\n' "$FILE"
              printf -- '- Size: %s\n' "$FILE_SIZE_HR"
              printf -- '- Type: %s\n' "$FILE_TYPE"
              printf -- '- Modified Time: %s\n' "$FILE_MOD_TIME"
              printf -- '- CRC32: %s\n' "$FILE_CRC32"
              printf -- '- MD5: %s\n' "$FILE_MD5"
              printf -- '- SHA1: %s\n' "$FILE_SHA1"
              printf -- '- SHA256: %s\n' "$FILE_SHA256"
              printf -- '- Source URL: %s\n' "$DOWNLOAD_URL"
            else
              printf '\nNo download requested.\n'
            fi
            printf -- '- Current URL: %s\n' "$CURRENT_URL"
          } > "$MSG_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- "$MSG_FILE"
          # Include this run's new commit-message file in the final listing.
          python3 "$TEMP_DIR/metadata.py" index
          git add -f -- liste.txt
          git commit -F "$MSG_FILE"
          git push

